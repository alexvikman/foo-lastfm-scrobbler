name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # A manual run builds and attests the package without publishing it.
  workflow_dispatch:

# The job opts in to the few permissions it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  release:
    name: Build, attest and publish
    # windows-2022 carries Visual Studio 2022 and the v143 toolset this
    # project targets; newer images ship a newer toolset.
    runs-on: windows-2022
    timeout-minutes: 30
    # The application API credentials are secrets of this environment.
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # request the signing certificate for the attestation
      attestations: write # store the attestation
      artifact-metadata: write # record where the attested package is stored
    env:
      PACKAGE: out/Release/foo_lastfm_scrobbler.fb2k-component
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches the component version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $source = Get-Content -Raw src/component.cpp
          if ($source -notmatch 'DECLARE_COMPONENT_VERSION\(\s*"[^"]*",\s*"([^"]+)"') {
            throw 'The component version could not be read from src/component.cpp.'
          }
          $version = $Matches[1]
          if (($env:TAG -replace '^v', '') -ne $version) {
            throw "Tag $env:TAG does not match component version $version."
          }

      - name: Write the application API credentials
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SHARED_SECRET: ${{ secrets.LASTFM_SHARED_SECRET }}
          PUBLISHING: ${{ github.ref_type == 'tag' }}
        run: |
          if (-not $env:LASTFM_API_KEY -and -not $env:LASTFM_SHARED_SECRET -and $env:PUBLISHING -ne 'true') {
            Write-Host '::warning::No API credentials are configured, so this trial package cannot connect an account.'
            exit 0
          }
          if ($env:LASTFM_API_KEY -notmatch '^[0-9a-f]{32}$' -or $env:LASTFM_SHARED_SECRET -notmatch '^[0-9A-Za-z]{8,}$') {
            throw 'The release environment must define LASTFM_API_KEY and LASTFM_SHARED_SECRET.'
          }
          @(
            '#pragma once'
            "#define FOO_LASTFM_API_KEY `"$env:LASTFM_API_KEY`""
            "#define FOO_LASTFM_SHARED_SECRET `"$env:LASTFM_SHARED_SECRET`""
          ) | Set-Content -Encoding ascii src/auth/api_credentials.local.h

      - name: Download and verify the pinned foobar2000 SDK
        run: ./scripts/bootstrap-sdk.ps1

      - name: Build and run the core tests
        run: ./scripts/build.ps1

      - name: Package and verify the exploit mitigations
        run: ./scripts/package.ps1

      - name: Attest the build provenance of the package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ env.PACKAGE }}

      - name: Keep the package as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foo_lastfm_scrobbler
          path: ${{ env.PACKAGE }}
          if-no-files-found: error
          retention-days: 7

      # A release drafted for this tag in the web interface receives the
      # package; otherwise the release is created here.
      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:PACKAGE
          } else {
            gh release create $env:TAG $env:PACKAGE --title $env:TAG --generate-notes --verify-tag
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Publishing the release failed with exit code $LASTEXITCODE."
          }
